name: Build Windows EXE

# 手動觸發：上傳到 GitHub 後，到 Actions 頁籤按「Run workflow」即可開始打包
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout 程式碼
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 打包成 exe
        run: pyinstaller --noconfirm excel_analyzer.spec

      - name: 上傳打包結果 (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ExcelAnalyzer-Windows
          path: dist/ExcelAnalyzer.exe
